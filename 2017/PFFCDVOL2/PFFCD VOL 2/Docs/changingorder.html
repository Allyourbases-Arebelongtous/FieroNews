<FONT SIZE=5><B>2.5 Changing Thread Order</B></FONT>
<HR>
By default, the <i>Threads View Window</i> displays the found threads in order of
<b>significance</b> (threads with the highest scores first). You can change this sort
order by clicking on one of the <b>Column Headers</b>:<BR>
<BR>
<CENTER><IMG SRC="2-8.gif"></CENTER>
<BR>
Clicking the same column header again will <b>reverse</b> the sort order.
